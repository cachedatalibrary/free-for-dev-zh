let $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
function render(){
let toc='',main='',q=($('#search')||$('#searchM')).value.toLowerCase();
D.forEach(c=>{
let id=c[0],zh=c[1],en=c[2],items=c[3].filter(i=>!q||i[0].toLowerCase().includes(q)||i[2].toLowerCase().includes(q)||i[3].toLowerCase().includes(q));
if(!items.length)return;
toc+=`<li><a href="#${id}" class="block px-2 py-1 rounded hover:bg-blue-50 text-gray-600 hover:text-blue-600 transition">${L=='zh'?zh:en}</a></li>`;
main+=`<section id="${id}" class="mb-8"><h2 class="text-xl font-bold mb-4 pb-2 border-b flex items-center gap-2"><i class="fas fa-layer-group text-blue-500"></i>${L=='zh'?zh:en}</h2><div class="grid grid-cols-1 md:grid-cols-2 gap-3">`;
items.forEach(i=>{
main+=`<a href="${i[1]}" target="_blank" class="item block p-3 bg-white rounded shadow-sm border border-gray-100 hover:border-blue-300 transition">
<div class="font-semibold text-blue-600 flex justify-between"><span>${i[0]}</span><i class="fas fa-external-link-alt text-xs text-gray-400 mt-1"></i></div>
<p class="text-sm text-gray-500 mt-1">${L=='zh'?i[2]:i[3]}</p></a>`;
});
main+=`</div></section>`;
});
$('#toc').innerHTML=toc;
$('#main').innerHTML=main||`<p class="text-center text-gray-400 mt-10">${L=='zh'?'无结果':'No results'}</p>`;
}
function setLang(l){
L=l;
$('#btnZh').className=l=='zh'?'px-3 py-1 text-xs rounded border active-lang':'px-3 py-1 text-xs rounded border';
$('#btnEn').className=l=='en'?'px-3 py-1 text-xs rounded border active-lang':'px-3 py-1 text-xs rounded border';
render();
}
function toggleMenu(){$('#sidebar').classList.toggle('open')}
$('#menuBtn').onclick=toggleMenu;
$('#search').oninput=$('#searchM').oninput=render;
$('#sidebar').addEventListener('click',e=>{if(e.target.tagName==='A'&&window.innerWidth<768)toggleMenu()});
render();
</script>
